# Configurazione Netlify · emanueledebenedictis.com
# Sito generato con Astro: Netlify compila e pubblica la cartella dist.

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
